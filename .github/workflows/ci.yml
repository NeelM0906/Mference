name: CI

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - converted_to_draft

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # macos-15 holds the Swift 6.1 / macOS 15 SDK floor; macos-26 exercises the
    # MSL 4.0 tensor-ops path. Both must build.
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - macos-26
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Report toolchain
        run: swift --version
      - name: Hold the Swift floor
        if: matrix.runner == 'macos-15'
        run: |
          # This leg exists only to prove the declared floor still builds. If
          # the runner image's default Xcode moves forward, the leg would
          # quietly start testing a newer toolchain and the floor would rot
          # unnoticed, so fail loudly instead.
          version=$(swift --version 2>&1 | sed -n 's/.*Swift version \([0-9][0-9]*\.[0-9][0-9]*\).*/\1/p' | head -1)
          # Exact match: the sed above yields major.minor only, so a glob like
          # 6.1* would also accept a future 6.10 and silently stop testing the
          # floor this leg exists to hold.
          case "$version" in
            6.1)
              echo "floor leg is exercising Swift $version, as intended"
              ;;
            *)
              echo "::error::This leg must prove the Swift 6.1 floor declared in Package.swift, but the runner provides Swift $version. Select an Xcode that ships Swift 6.1, or change the declared floor."
              exit 1
              ;;
          esac
      - name: Build release products
        run: swift build -c release
      - name: Run serial tests
        run: Scripts/test.sh

  docs:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-26
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check Markdown links
        # The checker reads UTF-8 Markdown; without an explicit locale Ruby
        # defaults to US-ASCII on a bare runner and aborts on the first
        # non-ASCII byte.
        run: LANG=en_US.UTF-8 ruby Scripts/check_markdown_links.rb
